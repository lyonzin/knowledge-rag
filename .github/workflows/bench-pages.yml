name: Bench Dashboard

# Runs bench/ (microbench) on every push to master AND runs the public
# BEIR/MTEB harnesses nightly, publishing all results as a static
# dashboard on GitHub Pages. Public transparency is the differentiator
# vs other RAG projects in the OSS space.
#
# IMPORTANT: this workflow is dormant until the maintainer enables
# GitHub Pages on the repo (Settings -> Pages -> Source: GitHub Actions).
# Until then, the deploy step skips with a warning. Bench results are
# still produced as workflow artifacts so the data is available for
# manual inspection.

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily — BEIR + MTEB harnesses run here, not on every push,
    # to keep dataset download traffic bounded and PR CI fast.
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  microbench:
    name: "Run pytest microbench"
    # Skip on schedule — the BEIR/MTEB jobs are the nightly deliverable
    # and this microbench already runs on every push to master.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + bench deps
        shell: bash
        run: |
          pip install -e .
          pip install pytest pytest-benchmark psutil numpy

      - name: Run benchmarks
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          pytest bench/ --benchmark-only --benchmark-min-rounds=5 \
            --benchmark-json=bench-current.json

      - name: Convert pytest-benchmark output to dashboard schema
        shell: bash
        run: |
          mkdir -p bench-results
          python - <<'PY'
          import json
          import datetime
          from pathlib import Path

          data = json.loads(Path("bench-current.json").read_text(encoding="utf-8"))
          for bench in data.get("benchmarks", []):
              name = bench["name"]
              median_ms = bench["stats"]["median"] * 1000.0
              payload = {
                  "schema_version": 1,
                  "harness": "microbench",
                  "dataset": name,
                  "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "knowledge_rag_version": "unknown",
                  "config": {"hybrid_alpha": 0.0, "fusion": "rrf",
                             "reranker_enabled": False, "top_k": 0},
                  "metrics": {"median_ms": round(median_ms, 6),
                              "ops_per_sec": round(bench["stats"]["ops"], 6)},
                  "wall_clock_seconds": {"index": 0.0,
                                         "query_avg_ms": round(median_ms, 3),
                                         "query_p50_ms": round(median_ms, 3),
                                         "query_p95_ms": round(median_ms, 3),
                                         "query_p99_ms": round(median_ms, 3)},
                  "corpus_size": 0,
                  "num_queries": bench["stats"].get("rounds", 0),
              }
              safe = name.replace("/", "_").replace(" ", "_")
              Path(f"bench-results/microbench-{safe}.json").write_text(
                  json.dumps(payload, indent=2), encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: microbench-results
          path: bench-results/

  beir-nightly:
    name: "BEIR harness (nightly)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dataset: [scifact, nfcorpus, arguana, fiqa]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + bench extras
        shell: bash
        run: |
          pip install -e ".[bench]"

      - name: Run BEIR harness (${{ matrix.dataset }})
        shell: bash
        env:
          # Datasets require network; embedding model downloads too.
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          mkdir -p bench-results
          python scripts/bench_beir.py \
            --dataset ${{ matrix.dataset }} \
            --limit 500 \
            --output bench-results/beir-${{ matrix.dataset }}.json \
            --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: beir-${{ matrix.dataset }}-results
          path: bench-results/

  mteb-nightly:
    name: "MTEB reranking harness (nightly)"
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dataset: [SciFactReranking, AskUbuntuDupQuestions]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + bench extras
        shell: bash
        run: |
          pip install -e ".[bench]"

      - name: Run MTEB harness (${{ matrix.dataset }})
        shell: bash
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          mkdir -p bench-results
          python scripts/bench_mteb.py \
            --dataset ${{ matrix.dataset }} \
            --output bench-results/mteb-${{ matrix.dataset }}.json \
            --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: mteb-${{ matrix.dataset }}-results
          path: bench-results/

  publish-dashboard:
    name: "Build + publish dashboard"
    needs: [microbench, beir-nightly, mteb-nightly]
    # Publish whenever at least one upstream job produced results; keep
    # going even if a matrix cell failed so a partial dashboard still
    # ships. ``always()`` is required because ``needs`` short-circuits on
    # skipped jobs (microbench is skipped on schedule; beir/mteb are
    # skipped on push).
    if: always() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download every result artifact
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Consolidate results
        shell: bash
        run: |
          mkdir -p bench-results
          # Every uploaded artifact is a directory named after its job,
          # containing one or more report JSONs. Flatten into
          # bench-results/ so bench_dashboard.py sees them all at once.
          find artifacts/ -type f -name '*.json' -exec cp {} bench-results/ \;
          ls -la bench-results/

      - name: Build dashboard
        shell: bash
        run: |
          python scripts/bench_dashboard.py \
            --input bench-results/ \
            --output site/ \
            --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: bench-dashboard
          path: site/

      - name: Setup Pages
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Upload to Pages
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
        continue-on-error: true

      - name: Deploy to Pages
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/deploy-pages@v5
        continue-on-error: true
