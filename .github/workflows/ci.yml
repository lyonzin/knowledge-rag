name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [master]

permissions:
  contents: read

# The test matrix lives in quality-gate.yml, so the required
# "Quality Gate Summary" check fails when any test cell fails (#269).
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check mcp_server/ tests/
      - name: Ruff format check
        run: ruff format --check mcp_server/ tests/
