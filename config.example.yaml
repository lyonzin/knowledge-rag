# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                                                                              ║
# ║                    KNOWLEDGE RAG — Configuration File                        ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# This file controls how Knowledge RAG indexes, searches, and organizes
# your documents. Every field is optional — sensible defaults are used
# when omitted.
#
# Quick start:
#   1. Copy this file → config.yaml
#   2. Set documents_dir to your folder
#   3. Run the server — everything else works out of the box
#
# Want a head start? Check the presets/ folder for domain-specific configs:
#   presets/cybersecurity.yaml  — Offensive/defensive security, CTFs, threat hunting
#   presets/developer.yaml      — Software engineering, APIs, DevOps
#   presets/research.yaml       — Academic research, papers, studies
#   presets/general.yaml        — Blank slate, zero domain logic
#
# Usage:  cp presets/developer.yaml config.yaml
#
# Need help? https://github.com/lyonzin/knowledge-rag


# ============================================================================
# PATHS
# ============================================================================
# Where your data lives. Relative paths resolve from this file's location.
# Absolute paths work too (e.g., /home/user/my-docs or C:\Users\you\docs).

paths:
  # Folder containing your documents (scanned recursively).
  # This is the only path most users need to change.
  documents_dir: "./documents"

  # Internal storage for indexes and embeddings.
  # You generally don't need to touch this.
  data_dir: "./data"

  # Persistent cache for embedding models (~250MB).
  # Prevents re-downloading after reboots (especially on Linux where /tmp is cleared).
  # Default: ./models_cache (relative to project root)
  models_cache_dir: "./models_cache"


# ============================================================================
# DOCUMENTS
# ============================================================================
# Control which files get indexed and how they're processed.

documents:
  # File types to index. Only files with these extensions are processed.
  # Remove or comment out formats you don't need.
  supported_formats:
    - .md        # Markdown
    - .txt       # Plain text
    - .pdf       # PDF documents
    - .docx      # Word documents
    - .py        # Python source code
    - .c         # C source code
    - .h         # C/C++ header files
    - .cpp       # C++ source code
    - .js        # JavaScript
    - .jsx       # React JSX
    - .ts        # TypeScript
    - .tsx       # React TypeScript TSX
    - .json      # JSON files
    - .xml       # XML files
    # - .xlsx    # Excel spreadsheets
    # - .pptx    # PowerPoint presentations
    # - .csv     # CSV data files
    # - .ipynb   # Jupyter Notebooks (extracts markdown + code cells)
    # - .mq4     # MetaTrader MQL4 source (opt-in, add to enable)
    # - .mqh     # MetaTrader MQL4/5 headers (opt-in, add to enable)

  # Exclude patterns — skip files/directories matching these patterns.
  # Uses fnmatch glob syntax. Patterns match against relative paths AND
  # individual path components (so "node_modules" matches at any depth).
  #
  # Examples:
  #   exclude_patterns:
  #     - "node_modules"     # Skip node_modules at any depth
  #     - ".git"             # Skip .git directories
  #     - "__pycache__"      # Skip Python cache
  #     - ".venv"            # Skip virtual environments
  #     - "*.tmp"            # Skip .tmp files anywhere
  #     - "drafts/*"         # Skip everything in top-level drafts/
  #
  # Default: [] (nothing excluded — all supported files are indexed)
  exclude_patterns: []

  # How documents are split into searchable chunks.
  #
  #   chunk_size    → Max characters per chunk. Larger = more context per
  #                   result, but less precise. Smaller = more precise,
  #                   but may lose context.
  #
  #   chunk_overlap → Characters shared between consecutive chunks.
  #                   Prevents information from being cut at chunk boundaries.
  #
  # Recommended presets:
  #   Short notes/snippets:  chunk_size: 500,  chunk_overlap: 100
  #   General use (default): chunk_size: 1000, chunk_overlap: 200
  #   Long technical docs:   chunk_size: 1500, chunk_overlap: 300
  chunking:
    chunk_size: 1000
    chunk_overlap: 200

  # ── Contextual Chunking (A3.6, Anthropic 2024) ─────────────────────
  # Opt-in per-chunk contextualization. For every chunk produced by the
  # fixed-size splitter, an LLM writes a 1-2 sentence context sentence
  # that situates the chunk in the whole document, and that sentence is
  # PREPENDED to the chunk before embedding + indexing. Anthropic reports
  # up to +49% retrieval recall improvement.
  #
  # Trade-offs:
  #   + significantly higher recall (per Anthropic 2024 benchmarks)
  #   - ONE LLM CALL PER CHUNK at ingestion time (expensive on first pass)
  #   - requires ``llm.provider`` configured or auto-detectable
  #     (missing provider falls back to raw chunks with a WARN log)
  #
  # Cost control: the built-in semantic cache (``[semantic_cache]``)
  # ensures re-indexing an UNCHANGED document pays zero LLM cost. Do
  # NOT disable the semantic cache while this feature is on.
  #
  # Precedence at ingestion:
  #   parent_document_enabled > code_aware_chunking > contextual_chunking > markdown > flat
  #
  # Requires a full reindex to enable/disable — chunk content changes.
  # Default OFF so a stock install has zero LLM calls.
  contextual_chunking: false


# ============================================================================
# MODELS
# ============================================================================
# AI models used for understanding and ranking your documents.
# Defaults work well for most cases — only change if you know what you're doing.

models:
  # Embedding model — converts text into vectors for semantic search.
  # Runs locally via ONNX (no API key needed, no data leaves your machine).
  #
  # Options (from fastest to most accurate):
  #   "BAAI/bge-small-en-v1.5"    → 384 dims, ~33MB, fast    (default)
  #   "BAAI/bge-base-en-v1.5"     → 768 dims, ~130MB, balanced
  #   "BAAI/bge-large-en-v1.5"    → 1024 dims, ~335MB, most accurate
  #
  # Multilingual alternatives:
  #   "BAAI/bge-small-zh-v1.5"         → Chinese
  #   "intfloat/multilingual-e5-small"  → 100+ languages
  #
  # WARNING: Changing this after indexing requires a full reindex.
  embedding:
    model: "BAAI/bge-small-en-v1.5"
    dimensions: 384
    # GPU acceleration for ONNX embeddings (5-10x faster indexing).
    # Requires: pip install knowledge-rag[gpu]  (installs onnxruntime-gpu)
    # Falls back to CPU automatically if CUDA is unavailable.
    gpu: false
    # Provider registry hook (advanced).
    # Selects which embedding provider knowledge-rag will use. "fastembed"
    # is the bundled default and runs the FastEmbed/ONNX pipeline exactly
    # as before. Set this only when you have a third-party plugin
    # registered under the `knowledge_rag.embeddings` entry-point group;
    # changing it without installing a plugin will fail at startup with a
    # clear error message.
    provider: "fastembed"

  # Vector store — persistent backend that holds embeddings + metadata.
  # "chromadb" is the bundled default (SQLite-backed, zero setup). Third-
  # party stores register themselves via the `knowledge_rag.vector_stores`
  # entry-point group.
  #
  # Opt-in multi-vector alternative: "colbert" swaps ChromaDB for PyLate +
  # PLAID late-interaction retrieval (ColBERTv2). Requires the extra:
  #     pip install "knowledge-rag[colbert]"
  # Storage cost scales ~10-100x versus single-vector; only enable when
  # recall is the bottleneck and GPU capacity is available. Requires a
  # full reindex to switch backends (embeddings shape-incompatible).
  vector_store:
    provider: "chromadb"

  # ColBERT checkpoint id/path. Only consulted when vector_store.provider
  # is "colbert" — inert on ChromaDB installs. Accepts any Hugging Face id
  # or local path that PyLate can load; default is the public baseline
  # (~360 MB download on first use).
  colbert_model: "colbert-ir/colbertv2.0"

  # Reranker — re-scores search results for better accuracy.
  # Adds ~50-100ms per query but significantly improves result quality.
  # Set enabled: false on low-resource machines if search feels slow.
  reranker:
    enabled: true
    model: "Xenova/ms-marco-MiniLM-L-6-v2"
    # How many extra candidates to fetch before reranking.
    # Higher = better accuracy but slower. 3 is a good balance.
    top_k_multiplier: 3
    # Provider registry hook (advanced). "cross_encoder" keeps the bundled
    # FastEmbed cross-encoder. Third-party rerankers register under the
    # `knowledge_rag.rerankers` entry-point group.
    provider: "cross_encoder"


# ============================================================================
# SEARCH
# ============================================================================
# Control search behavior and result limits.

search:
  # Number of results returned by default when no limit is specified.
  default_results: 5

  # Hard maximum — even if a client requests more, cap at this number.
  max_results: 20

  # ChromaDB collection name. Change this to maintain separate
  # knowledge bases in the same data directory.
  # Example: "work_kb", "research_kb", "personal_kb"
  collection_name: "knowledge_base"

  # ── Parent Document Retrieval (Small-to-Big) ───────────────────────
  # Opt-in hierarchical chunking. Indexes fine-grained "small" chunks
  # for precise retrieval, then swaps the returned content for the
  # broader "large" parent chunk that contains it. Classical
  # LangChain/LlamaIndex pattern — no LLM in the loop.
  #
  # Trade-offs:
  #   + more precise retrieval (small chunks match narrowly)
  #   + broader returned context (parent chunk)
  #   - larger vector store (more chunks per doc)
  #   - parent content stored inline in metadata (~6x overhead per parent)
  #
  # Requires a full reindex to enable/disable — chunk shape changes.
  # Default OFF so pre-existing corpora are byte-identical.
  parent_document_enabled: false
  # Target parent-chunk size in chars (broad-context window).
  parent_document_large_size: 1500
  # Target child-chunk size in chars (precise-match window).
  parent_document_small_size: 250
  # Overlap between adjacent children inside the same parent.
  parent_document_small_overlap: 50


# ============================================================================
# CATEGORIES
# ============================================================================
# Organize documents into categories based on their folder path.
# When a document's path contains a key below, it gets tagged with
# that category — enabling filtered searches.
#
# How it works:
#   A file at documents/recipes/italian/pasta.md
#   matches the pattern "recipes/italian" → category "italian"
#   and also matches "recipes" → category "cooking"
#   (most specific match wins)
#
# Set to empty {} to disable auto-categorization entirely.
# Documents will still be searchable — just without category filters.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │  path pattern (in documents_dir)    │    category name              │
# ├─────────────────────────────────────┼───────────────────────────────┤
# │  "recipes/italian"                  │    "italian"                  │
# │  "recipes"                          │    "cooking"                  │
# │  "work/projects"                    │    "projects"                 │
# │  "journal"                          │    "personal"                 │
# └─────────────────────────────────────┴───────────────────────────────┘

category_mappings: {}


# ============================================================================
# KEYWORD ROUTING
# ============================================================================
# Route search queries to specific categories based on keywords.
# When a query contains any of these keywords, results from that
# category are prioritized.
#
# This is a PERFORMANCE optimization, not a filter — results from
# other categories still appear, just ranked lower.
#
# Set to empty {} for pure semantic search with no keyword bias.

keyword_routes: {}


# ============================================================================
# QUERY EXPANSION
# ============================================================================
# Expand search terms with synonyms and abbreviations.
# When someone searches for "JS", also search for "JavaScript".
# This improves BM25 (keyword) recall without affecting semantic search.
#
# Format:
#   term:
#     - synonym1
#     - synonym2
#
# Set to empty {} for no expansion (search terms used as-is).

query_expansions: {}

# Symmetric query expansion groups — every term expands to every other term
# in the same group. Use this when you want mutual synonyms without writing
# duplicate directional entries in query_expansions.
#
# Format:
#   - ["term a", "term b", "term c"]
#   - ["abbreviation", "full phrase"]
#
# The final expansion table is built from BOTH query_expansions and
# query_expansion_groups. Legacy query_expansions entries are kept, then group
# links are added on top.

query_expansion_groups: []


# ============================================================================
# ADVANCED
# ============================================================================
# Settings for power users. Most people never need to touch these.

# advanced:
#   # File watcher — auto-reindex when documents change.
#   # Disable if you prefer manual reindexing only.
#   watch_for_changes: true
#   watch_debounce_seconds: 5
#
#   # BM25 parameters (keyword search tuning).
#   # k1: term frequency saturation (1.2-2.0). Higher = more weight on repeated terms.
#   # b:  length normalization (0.0-1.0). Higher = penalizes long documents more.
#   # bm25_k1: 1.5
#   # bm25_b: 0.75
#
#   # Logging verbosity: DEBUG, INFO, WARNING, ERROR
#   # log_level: "INFO"


# ============================================================================
# SERVER (new in v4.0.0)
# ============================================================================
# Controls transport, networking, and enterprise features.
# All fields are optional — defaults preserve v3.x stdio behavior.

server:
  # Transport protocol: "stdio" (legacy), "sse", "streamable-http"
  # stdio: 1 process per client (compatible with all MCP clients)
  # sse: 1 server serves N clients over HTTP+SSE (recommended for multi-agent)
  # streamable-http: 1 server, HTTP streaming
  transport: "stdio"

  # Network settings (ignored when transport is stdio)
  host: "127.0.0.1"
  port: 8179

  # Auth: optional bearer token validation (SSE/HTTP only)
  auth:
    bearer_token: ""

  # Rate limiting: optional per-client request throttling
  rate_limit:
    enabled: false
    requests_per_minute: 60
    burst: 10

  # Metrics: optional Prometheus-compatible /metrics endpoint
  metrics:
    enabled: false
    port: 9179


# ============================================================================
# TELEMETRY (A2.6)
# ============================================================================
# OpenTelemetry tracing + structured JSON logs. Both fields default OFF so
# the pre-A2.6 output shape is preserved for anyone who never edits this
# file. Tracing requires the optional [otel] extra:
#     pip install knowledge-rag[otel]
# Without the extra the server falls back to a no-op tracer with a warning.
telemetry:
  # Master switch for OpenTelemetry tracing. When false all spans collapse
  # to a zero-cost no-op — safe to leave enabled at the code level.
  enabled: false

  # Exporter kind: "otlp" (gRPC OTLP collector), "console" (batch-print
  # spans to stderr, useful for local debugging), or "none" (spans stay in
  # memory only — useful when a sidecar hooks into the OTel API directly).
  exporter: "otlp"

  # Value assigned to the ``service.name`` resource attribute. This is the
  # field APMs (Jaeger, Grafana Tempo, Datadog, New Relic) group by in the
  # UI. Set it per deployment when you run several instances against the
  # same collector.
  service_name: "knowledge-rag"

  # OTLP collector endpoint. Leave empty to fall back to the SDK default
  # (http://localhost:4317) and honour the standard OTEL_EXPORTER_OTLP_*
  # environment variables.
  otlp_endpoint: ""

  # Structured JSON logging. When true every log record becomes a single
  # JSON line (timestamp/level/logger/message + any extra_fields the caller
  # attached). When false plain-text formatter matches the pre-A2.6
  # ``print()`` output shape byte-for-byte for the common case.
  json_logs: false

  # Root log level — one of DEBUG / INFO / WARNING / ERROR / CRITICAL.
  # Invalid values silently fall back to INFO.
  log_level: "INFO"
