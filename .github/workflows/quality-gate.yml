name: Quality Gate

# 7 Pillars Quality Gate — wave 2 of 5 (Security + Versioning).
# Branch protection requires only "Quality Gate Summary" (plus "Lint &
# Format" in ci.yml); the summary fails when any job in its `needs` fails,
# is cancelled or times out. A job left out of `needs` does not block merges.
# More pillars (Stability, Memory, Versatility, Scalability, Quality) are
# added by subsequent waves.

on:
  pull_request:
    branches: [master]
    # labeled/unlabeled so bypass labels (skip-changelog, skip-test-count,
    # skip-perf-gate, skip-api-surface) re-evaluate the gate without needing
    # a forced push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

# Cancel earlier runs of the same PR when a new push lands. A running master
# run is never cancelled (a cancelled run fails the summary); GitHub still
# replaces a *pending* master run when a newer push arrives.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 1: SECURITY
  # ════════════════════════════════════════════════════════════════════════

  bandit:
    name: "Pillar 1 — Bandit SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Run bandit
        shell: bash
        run: |
          # Fail on HIGH severity, report MEDIUM as warning
          bandit -r mcp_server/ scripts/ --severity-level high --confidence-level medium

  semgrep:
    name: "Pillar 1 — Semgrep"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - name: Run semgrep with auto config
        shell: bash
        run: |
          # --error makes ERROR-level findings fail the job; warnings are reported but pass.
          semgrep --config=auto --error mcp_server/ scripts/

  pip-audit:
    name: "Pillar 1 — pip-audit (CVEs)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2" pip-audit
      - name: Audit dependency tree (without installing knowledge-rag)
        shell: bash
        # We audit the dependency tree only — NOT the knowledge-rag package
        # itself. Auditing knowledge-rag would always fail on release PRs
        # (the version about to ship is not yet on PyPI), and we already
        # fully exercise the project via the test suite. Resolving deps via
        # pip's installation report lets pip-audit see the real graph without installing
        # an editable / not-on-PyPI version.
        run: |
          # Materialize the actual dependency closure into a requirements
          # file by asking pip to resolve (without installing) what
          # `pip install .` would pull. Ignore installed tools so none of
          # the transitive dependencies disappear from the audit report.
          python -m pip install --dry-run --ignore-installed --report deps-report.json .
          python scripts/audit_requirements.py deps-report.json resolved-deps.clean.txt

          # Strict mode fails on any unfixed advisory. Documented exceptions:
          #   CVE-2026-45829/45830/45831/45833 (chromadb 1.5.9): no fix
          #     available as of 2026-09. 1.5.9 is latest. Remove when patched.
          ignore_args="--ignore-vuln CVE-2026-45829 --ignore-vuln CVE-2026-45830 --ignore-vuln CVE-2026-45831 --ignore-vuln CVE-2026-45833"
          if [ -n "${IGNORE_AUDIT_IDS:-}" ]; then
            for id in ${IGNORE_AUDIT_IDS}; do
              ignore_args="${ignore_args} --ignore-vuln ${id}"
            done
          fi
          pip-audit --strict --requirement resolved-deps.clean.txt ${ignore_args}

  gitleaks:
    name: "Pillar 1 — Gitleaks (secrets)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans full history
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  dependency-review:
    name: "Pillar 1 — Dependency Review"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    # Requires GitHub Dependency Graph to be enabled on the repo
    # (Settings -> Code security -> Dependency graph). Until the maintainer
    # flips that on, we run the action but do not block the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 6: VERSIONING
  # ════════════════════════════════════════════════════════════════════════

  version-sync:
    name: "Pillar 6 — Version sync (3 files)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify versions agree
        shell: bash
        run: python scripts/check_version_sync.py

  api-surface:
    name: "Pillar 6 — Public API surface"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request HEAD is the merge commit; HEAD^1 is the master
          # commit the PR is tested against.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Use master's API surface as the baseline
        # A PR must not approve its own breaking change by regenerating the
        # baseline. With the skip-api-surface label (an intentional break, set
        # by a maintainer) the PR's regenerated baseline is used. On push the
        # tree already is master: keep its own file.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-api-surface')
        shell: bash
        run: git show HEAD^1:.github/api-surface-baseline.json > .github/api-surface-baseline.json
      - name: Compare API surface against baseline
        shell: bash
        run: python scripts/check_api_surface.py --check

  conventional-commit-title:
    name: "Pillar 6 — Conventional commit (PR title)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            perf
            build
            ci
            style
            revert
          requireScope: false
          subjectPattern: ^[A-Za-z].+
          subjectPatternError: |
            The PR title subject must start with a letter and not be empty.
            Example: feat(server): add new search filter

  changelog:
    name: "Pillar 6 — CHANGELOG entry"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify ## Unreleased gained an entry (if user-facing PR)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python scripts/check_changelog.py --base-ref origin/master

  backwards-compat:
    name: "Pillar 6 — Backwards-compat tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          pip install -e .
          pip install pytest pytest-cov pyyaml
      - name: Run backwards-compat regression tests
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/test_backwards_compat.py -v

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 4: VERSATILITY
  # ════════════════════════════════════════════════════════════════════════

  versatility-presets:
    name: "Pillar 4 — Preset matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install minimal deps for YAML parsing
        shell: bash
        run: pip install pytest pyyaml
      - name: Run preset structural validation
        shell: bash
        run: pytest tests/test_presets.py -v

  versatility-locale:
    name: "Pillar 4 — Locale matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        shell: bash
        run: |
          pip install -e .
          pip install pytest
      - name: Run locale + encoding tests
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/test_locale.py -v

  versatility-formats:
    name: "Pillar 4 — Format smoke matrix"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        shell: bash
        run: |
          pip install -e .
          pip install pytest
      - name: Run format smoke tests
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/test_format_smoke.py -v

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 7: QUALITY
  # ════════════════════════════════════════════════════════════════════════

  mypy:
    name: "Pillar 7 — mypy strict (gradual)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy + package
        shell: bash
        run: |
          pip install mypy
          pip install -e .
      - name: Run mypy on annotated modules + scripts
        shell: bash
        # Gradual rollout: only modules already fully annotated. As legacy
        # code earns annotations, append paths here.
        run: mypy mcp_server/instance_lock.py mcp_server/preflight.py mcp_server/file_transaction.py mcp_server/publication.py mcp_server/filesystem.py mcp_server/pdf_support.py mcp_server/search_scope.py mcp_server/search_candidates.py scripts/

  interrogate:
    name: "Pillar 7 — Docstring coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install interrogate
      - name: Verify docstring coverage >= 80%
        shell: bash
        run: interrogate -c pyproject.toml mcp_server/

  radon:
    name: "Pillar 7 — Cyclomatic complexity"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Report-only for now: we know Config / orchestrator.query are D/E
    # (legacy hot-spots). Visibility helps the maintainer prioritize
    # refactors without blocking unrelated PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install radon
      - name: Report C+ complexity blocks
        shell: bash
        run: |
          echo "## Radon Cyclomatic Complexity (C and higher)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon cc mcp_server/ -a -nc | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Fail only when a NEW block is rated D+ — placeholder for now.
          # The followup PR will diff against master baseline.

  vulture:
    name: "Pillar 7 — Dead code (vulture)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true   # report-only initially
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install vulture
      - name: Scan for dead code (high-confidence only)
        shell: bash
        run: |
          vulture mcp_server/ scripts/ tests/_vulture_whitelist.py --min-confidence 80 \
            | tee vulture-report.txt || true
          if [ -s vulture-report.txt ] && grep -v "^$" vulture-report.txt > /dev/null; then
            echo "## Vulture findings (informational)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat vulture-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  pr-size:
    name: "Pillar 7 — PR size guard"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    continue-on-error: true   # warn-only by design
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Measure code change size (excluding docs/lockfiles)
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --numstat "${base}" "${head}" \
            -- 'mcp_server/**' 'scripts/**' 'tests/**' 'bench/**' \
            ':!*.md' ':!*.json' ':!*.lock' ':!*.txt' ':!*.yaml' ':!*.yml' \
            | awk '{added+=$1; removed+=$2} END {print added+removed}')
          changed=${changed:-0}
          echo "## PR size: ${changed} lines changed (code only)" >> $GITHUB_STEP_SUMMARY
          if [ "${changed}" -gt 500 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ This PR exceeds 500 lines of code change. Consider splitting into smaller PRs for easier review." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "(Warning only — this does not block merge.)" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ PR size is reasonable." >> $GITHUB_STEP_SUMMARY
          fi

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 2: STABILITY
  # ════════════════════════════════════════════════════════════════════════

  test-count:
    name: "Pillar 2 — Test count anti-regression"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD is the PR merge commit; HEAD^1 is the master commit it is
          # tested against, whose test count is the baseline below.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + pytest + collect-time deps
        shell: bash
        # The collect-only run imports every test module — including those
        # that depend on hypothesis, psutil, numpy, yaml. Install all of
        # them so collection succeeds across the full suite.
        run: |
          pip install -e .
          pip install pytest hypothesis psutil numpy pyyaml
      - name: Count master's tests as the baseline
        # The committed baseline is whatever the PR says it is; count the
        # tests of the master commit under test instead, in this same
        # environment and with this PR's counting script. With the bypass
        # label the comparison passes anyway, so the step is skipped.
        # Master's tests are collected with this PR's dependencies: if the PR
        # changes a dependency that they import, collection fails and the
        # label is the way through (a second venv would double the install).
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-test-count') }}
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          cp scripts/check_test_count.py "$RUNNER_TEMP/base/scripts/"
          if ! python "$RUNNER_TEMP/base/scripts/check_test_count.py" --update; then
            echo "::error title=test-count::Could not collect master's tests with this PR's dependencies. If the PR changes a dependency that master's tests import, a maintainer can add the skip-test-count label."
            exit 1
          fi
          cp "$RUNNER_TEMP/base/.github/test-count-baseline.txt" .github/test-count-baseline.txt
      - name: Verify test count has not regressed
        shell: bash
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python scripts/check_test_count.py

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 3: MEMORY
  # ════════════════════════════════════════════════════════════════════════

  memory-baseline:
    name: "Pillar 3 — Memory baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + memory deps
        shell: bash
        run: |
          pip install -e .
          pip install pytest psutil numpy
      - name: Run memory baseline tests
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/test_memory_baseline.py -v

  property-fuzz:
    name: "Pillar 4 (innovation) — Property-based fuzz"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + hypothesis
        shell: bash
        run: |
          pip install -e .
          pip install pytest hypothesis
      - name: Run property-based parser tests
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/test_ingestion_property.py -v

  # ════════════════════════════════════════════════════════════════════════
  # PILLAR 5: SCALABILITY (perf gate)
  # ════════════════════════════════════════════════════════════════════════

  perf-bench:
    name: "Pillar 5 — Performance regression gate (10%)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    # Promoted to required at v3.9.0. There is no bootstrap skip: a master
    # that cannot be benchmarked fails the gate, because skipping it would
    # let every later PR pass without being measured.
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + bench deps
        shell: bash
        run: |
          pip install -e .
          pip install pytest pytest-benchmark psutil numpy
      - name: Check out master in a separate worktree
        shell: bash
        run: |
          git fetch origin master:master-base
          git worktree add --detach "$RUNNER_TEMP/knowledge-rag-baseline" master-base
      - name: Benchmark branch and master interleaved
        shell: bash
        # Sub-100 µs medians move ±15–19% between runs of identical code and
        # the runner can drift during the job. Running branch, master, master,
        # branch gives each side runs early and late in the job, and the gate
        # compares the spread of each side's runs instead of a single pair.
        run: |
          run_bench() {  # $1: checkout to measure, $2: JSON file to write
            (cd "$1" && PYTHONPATH="$1" python -m pytest bench/ --benchmark-only --benchmark-min-rounds=3 \
              --benchmark-json="$GITHUB_WORKSPACE/$2")
          }
          master="$RUNNER_TEMP/knowledge-rag-baseline"
          run_bench "$GITHUB_WORKSPACE" branch-1.json
          run_bench "$master" master-1.json
          run_bench "$master" master-2.json
          run_bench "$GITHUB_WORKSPACE" branch-2.json
      - name: Preserve benchmark measurements and traced byte samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-gate-measurements
          path: |
            branch-1.json
            master-1.json
            master-2.json
            branch-2.json
          if-no-files-found: warn
      - name: Compare and gate
        shell: bash
        env:
          # skip-perf-gate bypasses only the run that adding it triggers; a
          # later push, another label or removing it is measured normally.
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          python scripts/check_perf_regression.py --master master-1.json master-2.json \
            --branch branch-1.json branch-2.json

  # ════════════════════════════════════════════════════════════════════════
  # PILLARS 2 + 4: FULL TEST SUITE (3 OS x 3 Python)
  # ════════════════════════════════════════════════════════════════════════

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload (ubuntu-latest / 3.12 cell only)
    # Pillar 4 (Versatility): 3 OS x 3 Python = 9 combos, all required.
    # All cells were green for two consecutive Quality Gate cycles
    # (Onda 3 + Onda 4) on macOS and Python 3.13 — promoted from
    # experimental to required at v3.9.0.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # bash (-eo pipefail) stops at the first failing command; on Windows
        # the default pwsh only checks the exit code of the last one.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-rerunfailures pytest-timeout hypothesis psutil numpy pyyaml hatchling

      - name: Run tests with coverage
        # Force bash on Windows too — the default pwsh shell propagates ANY
        # stderr write as a non-zero exit code through its $LASTEXITCODE
        # handling in some configurations, even when pytest itself exited
        # cleanly. Bash inherits pytest's actual return code.
        shell: bash
        env:
          # Forbid any HuggingFace network call. Tests must mock TextEmbedding
          # / TextCrossEncoder. A leaked real download (race condition spawning
          # a daemon thread, missing mock, etc.) would otherwise hang on slow
          # Windows runners and produce "ValueError: I/O operation on closed
          # file" during interpreter shutdown. With OFFLINE=1, any leak fails
          # fast and visibly.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Disable HF Hub download progress bars (they spawn worker threads
          # that race against pytest's interpreter shutdown).
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        # --reruns=1 retries flaky tests once (Pillar 2: Stability); the next
        # step lists every rerun in the job summary so flakes stay visible.
        # --timeout=300 fails a hung test instead of burning the job budget.
        # pipefail keeps pytest's exit status through the tee.
        run: |
          set -o pipefail
          pytest tests/ -v --cov=mcp_server --cov-report=xml --cov-report=term-missing --reruns=1 --timeout=300 --junit-xml=junit.xml | tee pytest.log

      - name: List reruns in the job summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if grep -q RERUN pytest.log 2>/dev/null; then
            {
              echo "### Reruns (Python ${{ matrix.python-version }}, ${{ matrix.os }})"
              echo '```'
              grep RERUN pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        # Advisory: an OIDC or Codecov outage must not fail a green test run
        # (fail_ci_if_error does not cover the OIDC token step).
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

  # ════════════════════════════════════════════════════════════════════════
  # SUMMARY
  # ════════════════════════════════════════════════════════════════════════

  summary:
    name: "Quality Gate Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # always(), not !cancelled(): GitHub counts a skipped required check as
    # passing, so the summary must still run, and fail, in a cancelled run.
    if: always()
    needs:
      # Pillar 1 — Security
      - bandit
      - semgrep
      - pip-audit
      - gitleaks
      # Pillar 3 — Memory
      - memory-baseline
      # Pillar 4 — Versatility
      - versatility-presets
      - versatility-locale
      - versatility-formats
      - property-fuzz
      # Pillar 5 — Scalability (blocking from v3.9.0)
      - perf-bench
      # Pillar 2 — Stability (blocking from v3.9.0)
      - test-count
      # Pillar 6 — Versioning
      - version-sync
      - api-surface
      - backwards-compat
      # Pillar 7 — Quality (blocking)
      - mypy
      - interrogate
      # Pillars 2 + 4 — full test suite, 3 OS x 3 Python
      - test
    steps:
      - name: Aggregate results
        shell: bash
        env:
          # Every job in `needs`, so a job added there can never be left out
          # of the check below.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "## Quality Gate Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pillar | Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Security | Bandit SAST | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Security | Semgrep | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Security | pip-audit | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 Security | Gitleaks | ${{ needs.gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 Memory | Baseline tests | ${{ needs.memory-baseline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 Versatility | Preset matrix | ${{ needs.versatility-presets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 Versatility | Locale matrix | ${{ needs.versatility-locale.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 Versatility | Format matrix | ${{ needs.versatility-formats.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 Versatility | Property-based fuzz | ${{ needs.property-fuzz.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 Stability | Test count guard | ${{ needs.test-count.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 Scalability | Perf gate 10% | ${{ needs.perf-bench.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 Versioning | Version sync | ${{ needs.version-sync.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 Versioning | API surface | ${{ needs.api-surface.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6 Versioning | Backwards-compat | ${{ needs.backwards-compat.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 Quality | mypy strict | ${{ needs.mypy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7 Quality | Docstring coverage | ${{ needs.interrogate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2+4 Stability/Versatility | Test matrix (3 OS x 3 Python) | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          # Only `success` and `skipped` pass. `failure`, `cancelled` (which
          # includes a job killed by timeout-minutes) and anything else fail.
          # `skipped` happens only by design: on pull_request every job in
          # `needs` runs (none has its own `needs`, and the only `if:` filters,
          # on perf-bench and test-count, select pull_request); on push those
          # two PR-only jobs skip.
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "❌ A required job ended as '$r'. Address the issues above before review." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All blocking Quality Gate pillars passed." >> $GITHUB_STEP_SUMMARY
