name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check mcp_server/ tests/
      - name: Ruff format check
        run: ruff format --check mcp_server/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})${{ matrix.experimental && ' [experimental]' || '' }}
    needs: lint
    runs-on: ${{ matrix.os }}
    # Pillar 4 (Versatility): 3 OS x 3 Python = 9 combos.
    # Stable combos (Linux+Windows x 3.11+3.12) must pass.
    # Experimental combos (macOS, Python 3.13) report visibly but do not
    # block the gate yet — fastembed/onnxruntime wheels for those targets
    # are still catching up. Promotion to required happens in a future PR
    # once two consecutive nightlies are green.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
        experimental: [false]
        include:
          # ── macOS x 3.11/3.12 (experimental) ──
          - os: macos-latest
            python-version: "3.11"
            experimental: true
          - os: macos-latest
            python-version: "3.12"
            experimental: true
          # ── Python 3.13 across all OS (experimental) ──
          - os: ubuntu-latest
            python-version: "3.13"
            experimental: true
          - os: windows-latest
            python-version: "3.13"
            experimental: true
          - os: macos-latest
            python-version: "3.13"
            experimental: true

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        # Force bash on Windows too — the default pwsh shell propagates ANY
        # stderr write as a non-zero exit code through its $LASTEXITCODE
        # handling in some configurations, even when pytest itself exited
        # cleanly. Bash inherits pytest's actual return code.
        shell: bash
        env:
          # Forbid any HuggingFace network call. Tests must mock TextEmbedding
          # / TextCrossEncoder. A leaked real download (race condition spawning
          # a daemon thread, missing mock, etc.) would otherwise hang on slow
          # Windows runners and produce "ValueError: I/O operation on closed
          # file" during interpreter shutdown. With OFFLINE=1, any leak fails
          # fast and visibly.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          # Disable HF Hub download progress bars (they spawn worker threads
          # that race against pytest's interpreter shutdown).
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: pytest tests/ -v --cov=mcp_server --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          file: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
