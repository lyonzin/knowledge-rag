[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-rag"
version = "4.6.0"
description = "Local RAG System for Claude Code — Hybrid search + Cross-encoder Reranking + 13 MCP Tools + 20 Format Parsers. Zero external servers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Lyon.", email = "lyonzin@users.noreply.github.com"},
]
keywords = [
    "rag", "mcp", "claude-code", "semantic-search", "embeddings",
    "chromadb", "bm25", "reranking", "knowledge-base", "local-ai",
    "fastembed", "retrieval-augmented-generation", "hybrid-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "chromadb>=1.4.0",
    "pymupdf>=1.23.0",
    "fastembed[reranking]>=0.4.0",
    "mcp>=1.6.0,<2.0.0",
    "numpy>=1.24.0",
    "requests>=2.33.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "watchdog>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.14.0",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-curand-cu12",
    "nvidia-nvjitlink-cu12",
]
server = ["uvicorn>=0.20.0"]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
bench = [
    # Public BEIR + MTEB benchmark harnesses (scripts/bench_*.py). Opt-in so
    # the default install stays lean — nightly workflow enables this extra.
    "beir>=2.0.0",
    "pytrec-eval>=0.5",
    "mteb>=1.14.0",
]
# Code-aware chunking (A3.8). Opt-in — install with `pip install knowledge-rag[code]`
# to unlock AST-boundary chunking for Python, JS/TS, C/C++, Rust, Go, Java,
# Ruby, PHP source files. Without this extra the chunker silently falls back
# to fixed-size splitting, so nothing breaks. `tree-sitter-language-pack` is
# the actively-maintained successor of `tree-sitter-languages` and ships
# pre-built abi3 wheels for Python 3.10+ on all major OSes.
code = [
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.3.0",
]

# Learned retrieval fusion (R5.5). Opt-in — install with
# `pip install knowledge-rag[learned-fusion]` to unlock the ``learned`` fusion
# strategy backed by a scikit-learn classifier trained on Work Memory (M4.2)
# feedback via ``scripts/train_learned_fusion.py``. Default fusion stays RRF
# and the strategy silently falls back to RRF when this extra is not selected.
learned-fusion = [
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

# ── LLM provider extras (A3.1 — Fase 3 infra) ───────────────────────────────
# knowledge-rag NEVER calls an LLM by default. These extras only pull in the
# vendor SDK needed by a specific opt-in Fase 3 feature. Install exactly the
# providers you plan to use — none of them are dependencies of the base
# install, so `pip install knowledge-rag` stays lean.
#
# Each provider's ``is_available()`` returns False when its SDK is missing,
# so ``auto_detect_llm()`` silently skips providers whose extra was not
# installed — no crash, no import error, no config change required.
llm-anthropic = ["anthropic>=0.30.0"]
llm-openai = ["openai>=1.30.0"]
llm-gemini = ["google-generativeai>=0.7.0"]
llm-ollama = ["httpx>=0.27.0"]
# DeepSeek ships an OpenAI-compat endpoint, no vendor SDK of its own — the
# extra just installs the OpenAI SDK.
llm-deepseek = ["openai>=1.30.0"]
# Meta-extra: install every LLM backend at once. Convenient for CI matrices
# and for users who want auto-detect to cover the widest possible ground.
llm-all = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
]

# ── Matryoshka embedding extras (R5.4 — Fase 5 opt-in) ──────────────────────
# knowledge-rag defaults to bge-small-en-v1.5 (384-D) via FastEmbed. This
# extra unlocks the ``matryoshka`` embedding provider which supports adaptive
# dimensionality (64/128/256/512/768/1024 slices from a single model). Model
# choice + slice width are configured under ``models.matryoshka_*`` in
# ``config.yaml``. Nothing here is pulled in by ``pip install knowledge-rag``;
# the provider's SDK import is deferred so a config-selected but uninstalled
# extra raises a clear pip-install RuntimeError on first embed call rather
# than at import time. Reindex is required after switching provider or
# dimension (embeddings are incompatible across slice widths).
embed-matryoshka = [
    "sentence-transformers>=3.0.0",
    "einops>=0.7.0",       # required by nomic-embed-text-v1.5 (trust_remote_code)
    "torch>=2.0.0",
]

# ── Jina long-context + Late Chunking extras (R5.7 — Fase 5 opt-in) ─────────
# Unlocks the ``jina-v3`` embedding provider (long-context 8K, 1024-D) and
# the Late Chunking pipeline (Jina 2024) where each document is embedded IN
# FULL with a long-context model before per-chunk vectors are produced via
# token-level mean-pooling. Result: chunk embeddings carry global document
# context. Enable via ``documents.late_chunking: true`` in ``config.yaml``
# AND set ``models.embedding.provider: jina-v3``. Nothing here is pulled
# in by ``pip install knowledge-rag``; the provider's SDK import is
# deferred so a config-selected but uninstalled extra raises a clear
# pip-install RuntimeError on first embed call rather than at import time.
# Reindex is required after switching provider (1024 vs 384 dimensions —
# vectors are shape-incompatible with the default bge-small collection).
embed-jina = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "einops>=0.7.0",       # jina-embeddings-v3 uses einops via trust_remote_code
]

# ── ColBERT / multi-vector retrieval (R5.3 — Fase 5 opt-in) ─────────────────
# Registers the ``"colbert"`` vector store backend under the A2.2 provider
# registry. Late-interaction MaxSim retrieval via PyLate + PLAID (~360 MB
# default checkpoint + PyTorch ~1 GB on disk). The ChromaDB single-vector
# backend stays the default; install this extra ONLY when you specifically
# need multi-vector recall on terminology-heavy corpora. Storage cost
# scales roughly 10-100x versus single-vector, and switching backends
# requires a full reindex — vectors are shape-incompatible across engines.
colbert = [
    "pylate>=1.0.0",
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lyonzin/knowledge-rag"
Repository = "https://github.com/lyonzin/knowledge-rag"
Issues = "https://github.com/lyonzin/knowledge-rag/issues"
Changelog = "https://github.com/lyonzin/knowledge-rag/releases"

[project.scripts]
knowledge-rag = "mcp_server.cli:main"
knowledge-rag-guarded = "mcp_server.guarded:guarded_main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "mcp_server/data/config.example.yaml"
"presets/cybersecurity.yaml" = "mcp_server/data/cybersecurity.yaml"
"presets/developer.yaml" = "mcp_server/data/developer.yaml"
"presets/research.yaml" = "mcp_server/data/research.yaml"
"presets/general.yaml" = "mcp_server/data/general.yaml"

[tool.hatch.build.targets.sdist]
include = [
    "mcp_server/",
    "documents/examples/",
    "config.example.yaml",
    "presets/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "requirements.txt",
]
exclude = [
    "data/",
    "documents/security/",
    "documents/ctf/",
    "documents/logscale/",
    "documents/development/",
    "documents/general/",
    "documents/aar/",
    "venv/",
    "__pycache__/",
    "*.pyc",
    "scripts/",
    ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Limit retained tmp_path directories to avoid pytest's atexit cleanup race
# on Windows (cleanup_numbered_dir + pathlib.glob "garbage-*" can fail when
# many tmp dirs accumulate). Tests run isolated; we don't need history.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "chaos: failure-injection tests run in nightly workflow only",
]
# Default: skip chaos tests in regular pytest runs (PR + local).
# Nightly workflow opts in with `pytest -m chaos`.
addopts = "-m 'not chaos'"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"mcp_server/server.py" = ["E402"]  # stdout redirect must happen before imports
"mcp_server/retrieval/orchestrator.py" = ["E402"]  # logger + late-bind test hooks require imports below module-level setup

[tool.coverage.run]
source = ["mcp_server"]

[tool.coverage.report]
show_missing = true
fail_under = 35

# ── mypy: strict gradual rollout (Pillar 7) ─────────────────────────────────
# Strict mode is enabled GLOBALLY but with a per-module exclusion list while
# we incrementally annotate the legacy modules. The CI job runs strict on the
# allowlist below; new modules are added as they earn full annotations.
[tool.mypy]
# Pinned to 3.12 to match the CI runtime (Python 3.12) and to accept PEP 695
# ``type`` statements that recent third-party stubs (e.g. numpy/__init__.pyi)
# emit. The package itself still supports Python 3.11+ at runtime — this
# setting only governs the static-analysis target.
python_version = "3.12"
strict = true
show_error_codes = true
warn_unused_configs = true
warn_unreachable = true
ignore_missing_imports = true   # third-party libs (chromadb, fastembed, etc.) often lack stubs

# ── interrogate: docstring coverage (Pillar 7) ──────────────────────────────
[tool.interrogate]
fail-under = 80
verbose = 1
quiet = false
exclude = [
    "tests",
    "bench",
    "scripts",
    "build",
    "dist",
    "venv",
    ".venv",
]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-property-decorators = true
ignore-private = true
ignore-semiprivate = true
