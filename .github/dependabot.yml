version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "lyonzin"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    ignore:
      # onnxruntime-gpu >=1.28 publishes CUDA 13 wheels on PyPI while the
      # [gpu] extra pins CUDA 12 nvidia libraries (see pyproject.toml).
      # Keep <1.27 until a CUDA 13 extra exists.
      - dependency-name: "onnxruntime-gpu"
        versions: [">=1.27"]
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "lyonzin"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "monthly"
    reviewers:
      - "lyonzin"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "lyonzin"
    labels:
      - "docker"
      - "dependencies"
    open-pull-requests-limit: 2
    ignore:
      # Pin Docker base Python to versions covered by CI matrix.
      # Promote 3.14+ here AFTER it lands green in ci.yml + quality-gate.yml.
      - dependency-name: "python"
        versions: [">=3.14"]
