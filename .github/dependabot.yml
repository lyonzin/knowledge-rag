# Dependabot configuration for knowledge-rag.
#
# Cadence: weekly for pip/github-actions/npm (surface CVEs fast, group non-breaking
# updates into a single PR); monthly for docker (base-image bumps only bite when the
# CI matrix moves, so they can wait).
#
# See .github/openssf-best-practices.md § SCA for how this fits into the OpenSSF
# Passing/Silver criteria.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "lyonzin"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "lyonzin"
    labels:
      - "ci"
      - "dependencies"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "lyonzin"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "lyonzin"
    labels:
      - "docker"
      - "dependencies"
    open-pull-requests-limit: 2
    ignore:
      # Pin Docker base Python to versions covered by CI matrix.
      # Promote 3.14+ here AFTER it lands green in ci.yml + quality-gate.yml.
      - dependency-name: "python"
        versions: [">=3.14"]
